name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o -q maadenchi_tala_android_project*.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Install app icon, splash and fullscreen activity
        run: |
          cp -r native/res/. android/app/src/main/res/
          find android/app/src/main/res -name 'splash.png' -exec cp native/splash.png {} \;
          cp native/MainActivity.java android/app/src/main/java/com/maadenchi/tala/MainActivity.java
      - run: sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: maadenchi-tala-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
